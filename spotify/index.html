<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lofi Radar — Spotify · Veille</title>
<link rel="icon" type="image/png" href="../assets/lofi-radar-favicon.png">
<script type="speculationrules">
{"prerender":[{"source":"list","urls":["../","../social/"],"eagerness":"immediate"}]}
</script>
<script>
(()=>{
  window.__RADAR_WAS_PRERENDERED=!!document.prerendering;
  if(!(HTMLScriptElement.supports&&HTMLScriptElement.supports('speculationrules'))){
    ['../','../social/'].forEach(href=>{
      const hint=document.createElement('link');
      hint.rel='prefetch';hint.href=href;
      document.head.appendChild(hint);
    });
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="preload" as="script" href="../Spotify_Instant_data.js?v=20260825-toolbar-v1">
<link rel="stylesheet" href="dashboard.css?v=20260825-da-v2">
<link rel="stylesheet" href="../assets/css/radar-foundation.css?v=20260825-da-v1">
<link rel="stylesheet" href="instant.css?v=20260825-toolbar-v1">
</head>
<body>

<aside id="sidebar">
  <div class="logo">
    <img class="mark" src="../assets/lofi-radar-logo.jpg" alt="Lofi Radar">
    <div>
      <h1>Lofi <span>Radar</span></h1>
      <small>Spotify · Veille</small>
    </div>
  </div>
  <nav class="nav" id="nav">
    <div class="nav-label" data-fr="Analyse">Analyse</div>
    <button data-v="radar" class="active" data-fr="Opportunités"><span class="emo">💎</span>Opportunités<span class="count" id="c-radar"></span></button>
    <button data-v="ar-list" data-fr="Sélection"><span class="emo">⭐</span>Sélection<span class="count" id="c-ar-list"></span></button>
    <button data-v="opps" data-fr="Pistes"><span class="emo">🎶</span>Pistes<span class="count" id="c-opps"></span></button>
    <button data-v="artists" data-fr="Artistes"><span class="emo">🎸</span>Artistes<span class="count" id="c-art"></span></button>
    <button data-v="playlists" data-fr="Playlists"><span class="emo">📻</span>Playlists<span class="count" id="c-pl"></span></button>
    <button data-v="labels" data-fr="Labels"><span class="emo">🏷️</span>Labels<span class="count" id="c-lb"></span></button>
  </nav>
  <div class="side-foot">
    <div class="spotify-update-status-control">
      <button class="btn-spotify-update-status" id="btn-spotify-update-status" type="button" aria-expanded="false" aria-controls="spotify-update-status-panel" onclick="toggleSpotifyUpdateStatus(event)">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 7 10.8 16.2 6 11.4"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h10"/></svg>
        <span class="lbl">Mises à jour</span>
      </button>
      <section class="spotify-update-status-panel" id="spotify-update-status-panel" hidden aria-live="polite"></section>
    </div>
  </div>
</aside>

<button id="lang-btn" class="fr" title="Français / English">
  <span class="lg-slide"></span>
  <span class="lg-opt" data-l="en"><img src="https://flagcdn.com/40x30/gb.png" alt="English"></span>
  <span class="lg-opt" data-l="fr"><img src="https://flagcdn.com/40x30/fr.png" alt="Français"></span>
</button>

<main id="main">
  <header class="platform-header">
    <div class="radar-switch" role="navigation" aria-label="Changer de site Lofi Radar">
      <a class="yt" href="../" aria-label="YouTube"><img src="../assets/platform-youtube.svg" alt=""> <span>YouTube</span></a>
      <a class="sp on" href="./?app=20260825-toolbar-v1#opportunities" aria-current="page" aria-label="Spotify"><img src="../assets/platform-spotify.svg?v=20260825-logo-v3" width="24" height="24" alt=""> <span>Spotify</span></a>
      <a class="social" href="../social/" aria-label="Socials"><img src="../assets/platform-instagram.svg" alt=""> <span>Socials</span></a>
    </div>
  </header>
  <div id="view"><div class="instant-loader" aria-live="polite"><span></span><span></span><span></span></div></div>
</main>

<div id="track-modal" class="tmodal" style="display:none">
  <div class="tmbox" id="tmbox"></div>
</div>

<script src="../Spotify_Instant_data.js?v=20260825-toolbar-v1"></script>
<script src="instant.js?v=20260825-toolbar-v1"></script>
</body>
</html>
