name: Publish public dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # The comment radar patches these two files on gh-pages itself, dozens of
      # times a day. Rebuilding the whole site for a snapshot the dashboard
      # already re-reads at runtime would cost far more than the scan does.
      - "data/comment-opportunities/feed.json"
      - "data/comment-opportunities/refresh-status.json"

permissions:
  contents: write

concurrency:
  group: lofi-social-radar-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build the public dashboard
        run: pnpm build:preview

      - name: Publish the generated site on gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          pages_root="$(mktemp -d)"
          pages_dir="$pages_root/site"
          git worktree add --detach "$pages_dir" origin/gh-pages

          # Cached Instagram thumbnails live only on the public branch. Keep
          # them while replacing every generated asset and JSON snapshot.
          find "$pages_dir" -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name media \
            -exec rm -rf {} +
          cp -a work/pages-dist/. "$pages_dir"/
          touch "$pages_dir/.nojekyll"

          cd "$pages_dir"
          git config user.name "lofi-social-radar-bot"
          git config user.email "lofi-social-radar-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The public dashboard is already current."
            exit 0
          fi
          git commit -m "Publish public dashboard"
          git push origin HEAD:gh-pages
