name: Comment radar fast lane

# The point of this lane is latency. A trailer is worth commenting for about
# three hours, so a six-hourly scan finds it once the section is already full.
#
# Cost note: this runs every 15 minutes between 07:00 and 01:00 Paris, which is
# roughly 76 runs a day. Each run is a single job with no dependency install
# (the scripts are plain Node with type stripping), so it bills around a minute.
# Widen to `*/15 * * * *` for round-the-clock coverage, or relax to `*/20` if
# the Actions bill matters more than five minutes of latency.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 5-23 * * *"

permissions:
  contents: write

concurrency:
  group: lofi-comment-radar-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out radar source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Baseline readings live in the cache, not in git: they change every run
      # and only exist so the next run can measure a delta.
      - name: Restore the candidate baseline
        uses: actions/cache@v4
        with:
          path: data/comment-opportunities/candidates.json
          key: comment-radar-candidates-${{ github.run_id }}
          restore-keys: |
            comment-radar-candidates-

      - name: Scan the watchlist
        id: scan
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node --experimental-strip-types scripts/refresh-comment-opportunities.mjs --lane=fast

      - name: Validate the snapshot
        id: validation
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        run: |
          node --experimental-strip-types --test \
            tests/comment-opportunities.test.mjs \
            tests/comment-radar-refresh.test.mjs \
            tests/comment-drop-alerts.test.mjs \
            tests/lofi-voice.test.mjs

      # Runs before the commit so the alert timestamp travels in the same
      # commit as the card it belongs to.
      - name: Announce new drops in the CM channel
        if: steps.scan.outcome == 'success' && steps.validation.outcome == 'success'
        continue-on-error: true
        env:
          DISCORD_CM_WEBHOOK_URL: ${{ secrets.DISCORD_CM_WEBHOOK_URL }}
        run: node --experimental-strip-types scripts/notify-comment-drops.mjs

      - name: Commit the verified snapshot
        id: commit
        if: steps.scan.outcome == 'success' && steps.validation.outcome == 'success'
        run: |
          git config user.name "lofi-social-radar-bot"
          git config user.email "lofi-social-radar-bot@users.noreply.github.com"
          git add data/comment-opportunities/feed.json data/comment-opportunities/refresh-status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Rien de neuf sur le tableau."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Refresh comment radar"
          git pull --rebase origin main
          git push origin HEAD:main

      # Only the one JSON the dashboard re-reads at runtime is pushed to the
      # public branch. Rebuilding the whole site 76 times a day would cost far
      # more than the scan itself, and would change nothing on screen.
      - name: Publish the snapshot on the public branch
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          pages_dir="$(mktemp -d)/site"
          git worktree add --detach "$pages_dir" origin/gh-pages
          mkdir -p "$pages_dir/data/comment-opportunities"
          cp data/comment-opportunities/feed.json "$pages_dir/data/comment-opportunities/feed.json"
          cd "$pages_dir"
          git config user.name "lofi-social-radar-bot"
          git config user.email "lofi-social-radar-bot@users.noreply.github.com"
          git add data/comment-opportunities/feed.json
          if git diff --cached --quiet; then
            echo "Le tableau public est déjà à jour."
            exit 0
          fi
          git commit -m "Publish comment radar snapshot"
          git push origin HEAD:gh-pages

      - name: Mark an invalid or failed scan
        if: steps.scan.outcome == 'failure' || steps.validation.outcome == 'failure'
        run: exit 1
