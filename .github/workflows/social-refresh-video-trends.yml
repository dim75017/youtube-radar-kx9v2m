name: Social · Refresh video trends daily

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run again even if today's feed is already fresh
        required: false
        default: false
        type: boolean
  schedule:
    # Main daily scan, then a same-day retry if the first run did not publish.
    - cron: "17 4,16 * * *"

permissions:
  contents: write

concurrency:
  group: social-video-trends-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: social-app
    steps:
      - name: Check out radar source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan and refresh the qualified feed
        id: scan
        continue-on-error: true
        env:
          FORCE_TREND_REFRESH: ${{ inputs.force == true && '1' || '0' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node --experimental-strip-types scripts/refresh-social-trends.mjs

      - name: Validate the daily feed
        id: validation
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        run: node --experimental-strip-types --test tests/social-trends.test.mjs tests/social-trends-refresh.test.mjs

      - name: Commit the new successful snapshot
        id: commit
        if: steps.scan.outcome == 'success' && steps.validation.outcome == 'success'
        run: |
          git config user.name "lofi-social-radar-bot"
          git config user.email "lofi-social-radar-bot@users.noreply.github.com"
          git add data/trends/feed.json data/trends/refresh-status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh social trends"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Preserve a failed-attempt status
        if: steps.scan.outcome == 'failure'
        run: |
          git config user.name "lofi-social-radar-bot"
          git config user.email "lofi-social-radar-bot@users.noreply.github.com"
          git add data/trends/refresh-status.json
          git diff --cached --quiet || git commit -m "Record failed trend refresh"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Mark an invalid or failed scan
        if: steps.scan.outcome == 'failure' || steps.validation.outcome == 'failure'
        run: exit 1
