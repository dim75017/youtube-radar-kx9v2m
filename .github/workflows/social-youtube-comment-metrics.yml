name: Social · Collect YouTube comment metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: social-youtube-comment-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: social-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/collect_youtube_comment_metrics.mjs
      - run: node scripts/sync_youtube_comment_metrics.mjs
      - name: Save collected metrics
        run: |
          git config user.name "lofi-social-radar-bot"
          git config user.email "lofi-social-radar-bot@users.noreply.github.com"
          git add data/youtube-comment-metrics.json data/public-history.json data/public-history-summary.json data/owner-comment-refresh-status.json
          git diff --cached --quiet || git commit -m "Update YouTube comment metrics"
          git pull --rebase origin main
          git push origin HEAD:main
