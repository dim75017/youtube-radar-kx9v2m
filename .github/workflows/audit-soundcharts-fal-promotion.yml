name: Audit Soundcharts FAL promotion candidates

on:
  workflow_run:
    workflows: ["Backfill Soundcharts FAL Spotify IDs"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_soundcharts_fal_promotion_cohort.py
      - build_soundcharts_fal_review_manifest.py
      - Spotify_Browse_Catalogue_data.js
      - tests/test_build_soundcharts_fal_promotion_cohort.py
      - tests/test_soundcharts_fal_promotion_workflow_guardrails.py
      - .github/workflows/audit-soundcharts-fal-promotion.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: soundcharts-fal-promotion-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENCRYPTED_STATE_ARTIFACT: soundcharts-fal-phase2-spotify-id-state-v1-encrypted
      MINIMUM_STREAMS: '100000'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize isolated private and aggregate paths
        shell: bash
        run: |
          set -euo pipefail
          echo "RESTORE_DIR=$RUNNER_TEMP/fal-promotion-state" >> "$GITHUB_ENV"
          echo "PRIVATE_DIR=$RUNNER_TEMP/fal-promotion-private" >> "$GITHUB_ENV"
          echo "AGGREGATE_DIR=$RUNNER_TEMP/fal-promotion-aggregate" >> "$GITHUB_ENV"
          echo "REVIEW_MANIFEST=$RUNNER_TEMP/fal-promotion-private/soundcharts-fal-review-manifest-v1.json" >> "$GITHUB_ENV"
          echo "PRIVATE_COHORT=$RUNNER_TEMP/fal-promotion-private/soundcharts-fal-promotion-candidates-v1.json" >> "$GITHUB_ENV"
          echo "PROMOTION_SUMMARY=$RUNNER_TEMP/fal-promotion-aggregate/soundcharts-fal-promotion-summary-v1.json" >> "$GITHUB_ENV"
          echo "ENCRYPTED_COHORT=$RUNNER_TEMP/fal-promotion-private/soundcharts-fal-promotion-candidates-v1.tar.gz.enc" >> "$GITHUB_ENV"
          echo "ENCRYPTION_SUMMARY=$RUNNER_TEMP/fal-promotion-aggregate/soundcharts-fal-promotion-encryption-summary-v1.json" >> "$GITHUB_ENV"

      - name: Validate promotion audit guardrails
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            build_soundcharts_fal_review_manifest.py \
            build_soundcharts_fal_promotion_cohort.py
          python -m unittest \
            tests/test_build_soundcharts_fal_review_manifest.py \
            tests/test_build_soundcharts_fal_promotion_cohort.py \
            tests/test_soundcharts_fal_promotion_workflow_guardrails.py \
            -v
          test -z "$(git status --porcelain)"

      - name: Require dedicated private staging encryption key
        env:
          FAL_STAGING_ARTIFACT_KEY: ${{ secrets.FAL_STAGING_ARTIFACT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FAL_STAGING_ARTIFACT_KEY" ]]; then
            echo "FAL_STAGING_ARTIFACT_KEY is required to decrypt private FAL staging" >&2
            exit 1
          fi
          if (( ${#FAL_STAGING_ARTIFACT_KEY} < 24 )); then
            echo "FAL_STAGING_ARTIFACT_KEY must contain at least 24 characters" >&2
            exit 1
          fi

      - name: Restore newest encrypted Spotify-ID staging state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          FAL_STAGING_ARTIFACT_KEY: ${{ secrets.FAL_STAGING_ARTIFACT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESTORE_DIR" "$PRIVATE_DIR" "$AGGREGATE_DIR"
          listing="$RUNNER_TEMP/fal-spotify-id-state-artifacts.json"
          archive="$RUNNER_TEMP/fal-spotify-id-state.zip"
          encrypted_source="$RUNNER_TEMP/fal-spotify-id-state-source"
          mkdir -p "$encrypted_source"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ENCRYPTED_STATE_ARTIFACT}&per_page=100" \
            --output "$listing"
          selected="$(jq -c '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last // empty' "$listing")"
          if [[ -z "$selected" || "$selected" == "null" ]]; then
            echo "No encrypted Spotify-ID staging state is available" >&2
            exit 1
          fi
          artifact_id="$(jq -r '.id' <<<"$selected")"
          archive_url="$(jq -r '.archive_download_url' <<<"$selected")"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$archive_url" --output "$archive"
          unzip -q "$archive" -d "$encrypted_source"
          encrypted_file="$(find "$encrypted_source" -type f -name '*.tar.gz.enc' -print -quit)"
          test -s "$encrypted_file"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -pass env:FAL_STAGING_ARTIFACT_KEY \
            -in "$encrypted_file" | tar -xz -C "$RESTORE_DIR"
          phase2_db="$(find "$RESTORE_DIR" -type f -name 'soundcharts-fal-phase2-state-v3.sqlite3' -print -quit)"
          phase2_report="$(find "$RESTORE_DIR" -type f -name 'soundcharts-fal-phase2-report-v4.json' -print -quit)"
          test -s "$phase2_db"
          test -s "$phase2_report"
          echo "PHASE2_DB=$phase2_db" >> "$GITHUB_ENV"
          echo "PHASE2_REPORT=$phase2_report" >> "$GITHUB_ENV"
          echo "SOURCE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "source_artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: Build ephemeral private review manifest
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum "$PHASE2_DB" | cut -d' ' -f1)"
          python build_soundcharts_fal_review_manifest.py \
            --state "$PHASE2_DB" \
            --phase2-report "$PHASE2_REPORT" \
            --minimum-streams "$MINIMUM_STREAMS" \
            --json-out "$REVIEW_MANIFEST"
          after="$(sha256sum "$PHASE2_DB" | cut -d' ' -f1)"
          test "$before" = "$after"
          test -s "$REVIEW_MANIFEST"
          test -z "$(git status --porcelain)"

      - name: Compare exact IDs and build private promotion candidate cohort
        shell: bash
        run: |
          set -euo pipefail
          python build_soundcharts_fal_promotion_cohort.py \
            --review-manifest "$REVIEW_MANIFEST" \
            --canonical Spotify_Browse_Catalogue_data.js \
            --minimum-streams "$MINIMUM_STREAMS" \
            --private-cohort-out "$PRIVATE_COHORT" \
            --summary-out "$PROMOTION_SUMMARY"
          test -s "$PRIVATE_COHORT"
          test -s "$PROMOTION_SUMMARY"
          test -z "$(git status --porcelain)"

      - name: Verify exact deduplication and fail-closed candidate invariants
        shell: bash
        run: |
          set -euo pipefail
          python - "$PRIVATE_COHORT" "$PROMOTION_SUMMARY" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          private = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if private.get("staging_only") is not True or summary.get("staging_only") is not True:
              raise SystemExit("FAL promotion audit escaped private staging")
          for payload in (private, summary):
              if payload.get("canonical_written") is not False:
                  raise SystemExit("FAL promotion audit attempted a canonical write")
              if payload.get("dashboard_written") is not False:
                  raise SystemExit("FAL promotion audit attempted a dashboard write")
              if payload.get("promotion_executed") is not False:
                  raise SystemExit("FAL promotion audit executed an unapproved promotion")
          if summary.get("row_level_data_uploaded") is not False:
              raise SystemExit("Aggregate summary claims row-level publication")
          if summary.get("canonical_comparison_complete") is not True:
              raise SystemExit("Canonical comparison is incomplete")
          if summary.get("canonical_comparison_method") != "exact_spotify_track_id_only":
              raise SystemExit("Canonical comparison is not exact-ID based")
          if summary.get("explicit_dim_validation_required") is not True:
              raise SystemExit("Explicit Dim validation is no longer required")
          guardrails = private.get("guardrails") or {}
          if guardrails.get("audience_size_and_career_stage_never_block") is not True:
              raise SystemExit("Audience size or career stage can block the FAL cohort")
          if summary.get("audience_size_and_career_stage_never_block") is not True:
              raise SystemExit("Aggregate audit lost the audience/career-stage guardrail")
          candidates = private.get("tracks") or []
          if len(candidates) != int(summary.get("promotion_candidate_track_count") or 0):
              raise SystemExit("Private cohort and aggregate count differ")
          spotify_pattern = re.compile(r"[A-Za-z0-9]{22}")
          seen = set()
          for track in candidates:
              spotify_id = str(track.get("spotify_id") or "")
              if not spotify_pattern.fullmatch(spotify_id) or spotify_id in seen:
                  raise SystemExit("Candidate cohort contains an invalid or duplicate Spotify ID")
              seen.add(spotify_id)
              if track.get("blocking_fields"):
                  raise SystemExit("Blocked evidence entered the promotion candidate cohort")
              if track.get("canonical_duplicate_spotify_id") is not False:
                  raise SystemExit("Canonical duplicate entered the promotion candidate cohort")
              if track.get("explicit_dim_promotion_validation_required") is not True:
                  raise SystemExit("Candidate no longer requires Dim validation")
              if track.get("ai_review_required") is True and track.get("opportunity_eligible") is not False:
                  raise SystemExit("AI-unknown candidate entered Opportunities")
          forbidden_summary_keys = {
              "tracks", "rows", "records", "candidate_ids", "spotify_ids", "track_ids", "artist_ids"
          }
          if forbidden_summary_keys.intersection(summary):
              raise SystemExit("Aggregate summary contains row-level keys")
          PY
          test -z "$(git status --porcelain)"

      - name: Encrypt private cohort and erase plaintext rows
        env:
          FAL_STAGING_ARTIFACT_KEY: ${{ secrets.FAL_STAGING_ARTIFACT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          tar -cz -C "$PRIVATE_DIR" "$(basename "$PRIVATE_COHORT")" | \
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -salt \
              -pass env:FAL_STAGING_ARTIFACT_KEY -out "$ENCRYPTED_COHORT"
          test -s "$ENCRYPTED_COHORT"
          python - "$ENCRYPTED_COHORT" "$ENCRYPTION_SUMMARY" "$PROMOTION_SUMMARY" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          encrypted = Path(sys.argv[1])
          aggregate = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          summary = {
              "version": 1,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "artifact_name": "soundcharts-fal-promotion-candidates-v1-encrypted",
              "cipher": "AES-256-CBC",
              "key_derivation": "PBKDF2-HMAC-SHA256",
              "iterations": 600000,
              "salted": True,
              "plaintext_uploaded": False,
              "row_level_data_uploaded_unencrypted": False,
              "encrypted_bytes": encrypted.stat().st_size,
              "encrypted_sha256": hashlib.sha256(encrypted.read_bytes()).hexdigest(),
              "source_artifact_id": os.environ.get("SOURCE_ARTIFACT_ID", ""),
              "promotion_candidate_track_count": aggregate.get("promotion_candidate_track_count"),
              "promotion_candidate_artist_count": aggregate.get("promotion_candidate_artist_count"),
              "explicit_dim_validation_required": True,
          }
          Path(sys.argv[2]).write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          rm -f "$REVIEW_MANIFEST" "$PRIVATE_COHORT"
          test ! -e "$REVIEW_MANIFEST"
          test ! -e "$PRIVATE_COHORT"
          test -s "$PROMOTION_SUMMARY"
          test -s "$ENCRYPTION_SUMMARY"
          test -z "$(git status --porcelain)"

      - name: Upload encrypted private promotion candidates only
        uses: actions/upload-artifact@v4
        with:
          name: soundcharts-fal-promotion-candidates-v1-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ENCRYPTED_COHORT }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload aggregate promotion audit report only
        uses: actions/upload-artifact@v4
        with:
          name: soundcharts-fal-promotion-summary-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROMOTION_SUMMARY }}
            ${{ env.ENCRYPTION_SUMMARY }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Confirm repository remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
