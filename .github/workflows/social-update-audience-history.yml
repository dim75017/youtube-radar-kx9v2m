name: Social · Update audience history daily

on:
  workflow_dispatch:
  schedule:
    # Two daily collection passes, one in the morning and one in the evening UTC.
    - cron: "37 6 * * *"
    - cron: "37 18 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: social-audience-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: social-app
    steps:
      - name: Check out radar source
        uses: actions/checkout@v4
        with:
          ref: main
          # The unified repository contains large historical media snapshots.
          # This job needs only the Social runtime and its own workflow tests.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /social-app/
            /.github/workflows/social-update-audience-history.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect real follower observations
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: >-
          node --experimental-strip-types scripts/collect-audience-history.mjs
          --require-fresh-platform youtube
          --require-fresh-platform x

      - name: Validate audience history and calculations
        run: node --experimental-strip-types --test tests/audience-metrics.test.mjs

      - name: Commit only the audience snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lofi-social-radar-bot"
          git config user.email "lofi-social-radar-bot@users.noreply.github.com"
          git add data/audience-history.json
          git diff --cached --quiet || git commit -m "Update audience history"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main \
            -f requested_sha="$(git rev-parse HEAD)"
