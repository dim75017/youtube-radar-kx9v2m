name: Scan Soundcharts Fans Also Like phase 2

on:
  workflow_run:
    workflows: ["Scan Soundcharts Fans Also Like phase 1"]
    types: [completed]
  workflow_dispatch:
    inputs:
      max_requests:
        description: 'Maximum Soundcharts attempts including retries (1-40000)'
        required: true
        default: '500'
        type: string
      max_new_queue:
        description: 'Maximum gated recent tracks migrated into the private queue (1-10000)'
        required: true
        default: '2000'
        type: string
      continue_zero_yield:
        description: 'Explicitly continue after a zero-signal 500-track canary'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

# This is the exact lock used by every Soundcharts collector. Phase 1 is the
# single scheduled root; this phase resumes only from that exact handoff or a
# deliberate manual dispatch.
concurrency:
  group: refresh-soundcharts-ar-collection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase2:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PHASE1_STATE_ARTIFACT: soundcharts-fal-phase1-state-v2
      PHASE1_CONTROL_ARTIFACT: soundcharts-fal-phase1-control-v2
      # v3 intentionally starts a clean private checkpoint: the former v2
      # gate queried Soundcharts' reduced /api/v2/artist representation, so
      # its genre-empty review decisions must be fetched again via v2.9.
      PHASE2_STATE_ARTIFACT: soundcharts-fal-phase2-state-v3
      # v4 invalidates any earlier "complete" control report because the
      # lifetime-stream gate did not exist in those runs. The resumable SQLite
      # state remains v3 and is migrated in place by the scanner.
      # v5 proves that the completion report and the persisted SQLite state
      # consumed the same immutable phase-1 artifact.  Older controls could be
      # produced from the observational dry-run copy and must never authorize a
      # green no-op.
      PHASE2_CONTROL_ARTIFACT: soundcharts-fal-phase2-control-v5
      QUOTA_RESERVE: '500000'
      MAINTENANCE_DAILY_REQUESTS: '60000'
      MAINTENANCE_THROUGH: '2026-08-18'
      ACTIVE_QUEUE_CAP: '5000'
      CANARY_MIN_SAMPLE: '500'
      RECENT_DAYS: '1095'
      TRACK_MIN_LIFETIME_STREAMS: '100000'
      WORKERS: '10'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize isolated private staging paths
        shell: bash
        run: |
          echo "PHASE1_DIR=$RUNNER_TEMP/soundcharts-fal-phase1-readonly" >> "$GITHUB_ENV"
          echo "PHASE2_DIR=$RUNNER_TEMP/soundcharts-fal-phase2" >> "$GITHUB_ENV"
          echo "PHASE2_DB=$RUNNER_TEMP/soundcharts-fal-phase2/soundcharts-fal-phase2-state-v3.sqlite3" >> "$GITHUB_ENV"
          echo "REPORT_JSON=$RUNNER_TEMP/soundcharts-fal-phase2/soundcharts-fal-phase2-report-v4.json" >> "$GITHUB_ENV"
          echo "REQUEST_JOURNAL=$RUNNER_TEMP/soundcharts-fal-phase2/fal-phase2-request-attempts.log" >> "$GITHUB_ENV"

      - name: Validate phase-2 scanner and workflow guardrails
        run: |
          python -m py_compile scan_soundcharts_fal_phase2.py soundcharts_fal_artist_gate.py
          python -m unittest \
            tests/test_scan_soundcharts_fal_phase2.py \
            tests/test_soundcharts_fal_artist_gate.py \
            tests/test_soundcharts_fal_phase2_workflow_guardrails.py \
            -v

      - name: Validate bounded request plan
        id: plan
        env:
          REQUESTED_MAX_REQUESTS: ${{ inputs.max_requests }}
          REQUESTED_MAX_NEW_QUEUE: ${{ inputs.max_new_queue }}
          REQUESTED_CONTINUE_ZERO_YIELD: ${{ inputs.continue_zero_yield }}
        shell: bash
        run: |
          default_max_requests=500
          default_max_new_queue=2000
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            default_max_requests=40000
            default_max_new_queue=10000
          fi
          max_requests="${REQUESTED_MAX_REQUESTS:-$default_max_requests}"
          max_new_queue="${REQUESTED_MAX_NEW_QUEUE:-$default_max_new_queue}"
          continue_zero_yield="${REQUESTED_CONTINUE_ZERO_YIELD:-false}"
          if [[ ! "$max_requests" =~ ^[1-9][0-9]{0,4}$ ]] || (( 10#$max_requests > 40000 )); then
            echo "max_requests must be an integer between 1 and 40000" >&2
            exit 1
          fi
          if [[ ! "$max_new_queue" =~ ^[1-9][0-9]{0,4}$ ]] || (( 10#$max_new_queue > 10000 )); then
            echo "max_new_queue must be an integer between 1 and 10000" >&2
            exit 1
          fi
          if [[ "$continue_zero_yield" != "true" && "$continue_zero_yield" != "false" ]]; then
            echo "continue_zero_yield must be true or false" >&2
            exit 1
          fi
          echo "max_requests=$max_requests" >> "$GITHUB_OUTPUT"
          echo "max_new_queue=$max_new_queue" >> "$GITHUB_OUTPUT"
          echo "continue_zero_yield=$continue_zero_yield" >> "$GITHUB_OUTPUT"

      - name: Check the small phase-2 control before downloading phase 1
        id: early_control
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "no_op=false" >> "$GITHUB_OUTPUT"
          phase1_listing="$RUNNER_TEMP/soundcharts-fal-phase1-v2-artifacts-early.json"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PHASE1_STATE_ARTIFACT}&per_page=100" \
            --output "$phase1_listing"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            triggering_phase1_run_id="${{ github.event.workflow_run.id }}"
            control_listing="$RUNNER_TEMP/soundcharts-fal-phase1-control-trigger.json"
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PHASE1_CONTROL_ARTIFACT}&per_page=100" \
              --output "$control_listing"
            trigger_control="$(jq -c --arg run_id "$triggering_phase1_run_id" \
              '[.artifacts[] | select(.expired == false and (.workflow_run.id | tostring) == $run_id)] | sort_by(.created_at) | last // empty' "$control_listing")"
            if [[ -z "$trigger_control" || "$trigger_control" == "null" ]]; then
              echo "Triggering Phase-1 run has no exact completion control" >&2
              exit 1
            fi
            trigger_control_zip="$RUNNER_TEMP/soundcharts-fal-phase1-control-trigger.zip"
            trigger_control_dir="$RUNNER_TEMP/soundcharts-fal-phase1-control-trigger"
            mkdir -p "$trigger_control_dir"
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$(jq -r '.archive_download_url' <<<"$trigger_control")" \
              --output "$trigger_control_zip"
            unzip -o -q "$trigger_control_zip" -d "$trigger_control_dir"
            trigger_report="$(find "$trigger_control_dir" -type f -name 'soundcharts-fal-phase1-report-v2.json' -print -quit)"
            trigger_ledger="$(find "$trigger_control_dir" -type f -name '*seed-ledger-v2.json' -print -quit)"
            test -s "$trigger_report"
            test -s "$trigger_ledger"
            python - "$trigger_report" "$trigger_ledger" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          from scan_soundcharts_fal_phase1 import validate_report_seed_ledger

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          ledger = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          # A no-op run rebuilds an equivalent ledger at a newer timestamp,
          # while deliberately reusing the previously verified state. Bind the
          # exact cohort/count here; the restored state is checked below.
          validate_report_seed_ledger(report, ledger, require_generation_match=False)
          if report.get("complete") is not True or report.get("status") != "complete":
              raise SystemExit("Triggering Phase-1 completion control is not complete")
          if report.get("staging_only") is not True or report.get("canonical_written") is not False:
              raise SystemExit("Triggering Phase-1 completion control escaped private staging")
          cohort_hash = str(ledger.get("cohort_hash") or "")
          if len(cohort_hash) != 64:
              raise SystemExit("Triggering Phase-1 ledger has no exact cohort hash")
          with Path(sys.argv[3]).open("a", encoding="utf-8") as output:
              output.write(f"expected_cohort_hash={cohort_hash}\n")
          PY
            phase1_selected="$(jq -c --arg run_id "$triggering_phase1_run_id" \
              '[.artifacts[] | select(.expired == false and (.workflow_run.id | tostring) == $run_id)] | sort_by(.created_at) | last // empty' "$phase1_listing")"
            phase1_state_exact="true"
            if [[ -z "$phase1_selected" || "$phase1_selected" == "null" ]]; then
              # A completed no-op Phase-1 intentionally skips re-uploading its
              # multi-GB state. The exact control above binds the cohort; the
              # restored prior state is checked against that hash before use.
              phase1_selected="$(jq -c '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last // empty' "$phase1_listing")"
              phase1_state_exact="false"
              echo "phase1_selection_mode=validated_noop_state" >> "$GITHUB_OUTPUT"
            else
              echo "phase1_selection_mode=exact_trigger_state" >> "$GITHUB_OUTPUT"
            fi
          else
            triggering_phase1_run_id=""
            phase1_state_exact="false"
            phase1_selected="$(jq -c '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last // empty' "$phase1_listing")"
            echo "expected_cohort_hash=" >> "$GITHUB_OUTPUT"
            echo "phase1_selection_mode=latest_recovery_state" >> "$GITHUB_OUTPUT"
          fi
          if [[ -z "$phase1_selected" || "$phase1_selected" == "null" ]]; then
            echo "No exact Phase-1 artifact is available for run ${triggering_phase1_run_id:-latest}" >&2
            exit 1
          fi
          phase1_id="$(jq -r '.id // empty' <<<"$phase1_selected")"
          phase1_run_id="$(jq -r '.workflow_run.id // empty' <<<"$phase1_selected")"
          test -n "$phase1_id"
          if [[ "$phase1_state_exact" == "true" && "$phase1_run_id" != "$triggering_phase1_run_id" ]]; then
            echo "Phase-1 artifact does not belong to the triggering workflow run" >&2
            exit 1
          fi
          echo "phase1_artifact_id=$phase1_id" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.plan.outputs.continue_zero_yield }}" == "true" ]]; then
            echo "Explicit manual zero-yield override requested; continuing"
            exit 0
          fi
          control_listing="$RUNNER_TEMP/soundcharts-fal-phase2-control-artifacts.json"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PHASE2_CONTROL_ARTIFACT}&per_page=100" \
            --output "$control_listing"
          control="$(jq -c '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last // empty' "$control_listing")"
          if [[ -z "$control" || "$control" == "null" ]]; then
            exit 0
          fi
          control_url="$(jq -r '.archive_download_url // empty' <<<"$control")"
          control_run_id="$(jq -r '.workflow_run.id // empty' <<<"$control")"
          test -n "$control_run_id"
          state_listing="$RUNNER_TEMP/soundcharts-fal-phase2-state-artifacts-early.json"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PHASE2_STATE_ARTIFACT}&per_page=100" \
            --output "$state_listing"
          same_run_state="$(jq -r --arg run_id "$control_run_id" \
            '[.artifacts[] | select(.expired == false and (.workflow_run.id | tostring) == $run_id)] | length' \
            "$state_listing")"
          archive="$RUNNER_TEMP/soundcharts-fal-phase2-control.zip"
          control_dir="$RUNNER_TEMP/soundcharts-fal-phase2-control"
          mkdir -p "$control_dir"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$control_url" --output "$archive"
          unzip -o -q "$archive" -d "$control_dir"
          report="$(find "$control_dir" -type f -name 'soundcharts-fal-phase2-report-v4.json' -print -quit)"
          test -n "$report"
          python - "$report" "$phase1_id" "$same_run_state" "$GITHUB_OUTPUT" "$REPORT_JSON" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          checkpoint = report.get("checkpoint") or {}
          source_checkpoint = report.get("source_checkpoint") or {}
          handoff = report.get("handoff") or {}
          work = report.get("work") or {}
          expected_phase1 = sys.argv[2]
          same_phase1 = (
              str(checkpoint.get("phase1_artifact_id") or "") == expected_phase1
              and str(source_checkpoint.get("phase1_source_id") or "") == expected_phase1
              and str(handoff.get("phase1_artifact_id") or "") == expected_phase1
              and str(handoff.get("phase1_source_id") or "") == expected_phase1
              and handoff.get("phase2_state_verified") is True
              and isinstance(handoff.get("phase2_state_sha256"), str)
              and len(handoff.get("phase2_state_sha256")) == 64
              and int(handoff.get("phase2_state_bytes") or 0) > 0
              and int(sys.argv[3]) > 0
          )
          paused = (
              report.get("status") == "paused_zero_evidence_yield"
              and int(work.get("artist_gate_active") or 0) == 0
              and int(work.get("track_stream_active") or 0) == 0
          )
          complete = report.get("complete") is True
          no_op = same_phase1 and (paused or complete)
          if no_op:
              target = Path(sys.argv[5])
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(sys.argv[1], target)
          with Path(sys.argv[4]).open("a", encoding="utf-8") as output:
              output.write(f"no_op={'true' if no_op else 'false'}\n")
              output.write(f"handoff_valid={'true' if same_phase1 else 'false'}\n")
          if (paused or complete) and not same_phase1:
              print(
                  "::warning title=FAL phase-2 handoff missing::"
                  "Completion control is not backed by the persisted phase-2 state; "
                  "forcing a full checkpoint restore instead of a green no-op"
              )
          print(
              "Phase 2 remains safely paused/complete; skipped the huge phase-1 download"
              if no_op else "Phase 2 has resumable work or a newer phase-1 source"
          )
          PY

      - name: Restore the exact immutable private phase-1 v2 checkpoint
        id: restore_phase1
        if: steps.early_control.outputs.no_op != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$PHASE1_DIR"
          artifact_id="${{ steps.early_control.outputs.phase1_artifact_id }}"
          metadata="$RUNNER_TEMP/soundcharts-fal-phase1-v2-artifact.json"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
            --output "$metadata"
          actual_name="$(jq -r '.name // empty' "$metadata")"
          expired="$(jq -r 'if has("expired") then .expired else true end' "$metadata")"
          if [[ "$actual_name" != "$PHASE1_STATE_ARTIFACT" || "$expired" != "false" ]]; then
            echo "Exact Phase-1 artifact ${artifact_id} is unavailable or has the wrong identity" >&2
            exit 1
          fi
          archive_url="$(jq -r '.archive_download_url // empty' "$metadata")"
          source_run_id="$(jq -r '.workflow_run.id // empty' "$metadata")"
          test -n "$artifact_id"
          test -n "$archive_url"
          archive="$RUNNER_TEMP/soundcharts-fal-phase1-v2.zip"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$archive_url" --output "$archive"
          unzip -o -q "$archive" -d "$PHASE1_DIR"
          phase1_db="$(find "$PHASE1_DIR" -type f -name 'soundcharts-fal-phase1-staging-v2.sqlite3' -print -quit)"
          phase1_report="$(find "$PHASE1_DIR" -type f -name 'soundcharts-fal-phase1-report-v2.json' -print -quit)"
          test -n "$phase1_db"
          test -s "$phase1_db"
          test -n "$phase1_report"
          test -s "$phase1_report"
          echo "PHASE1_DB=$phase1_db" >> "$GITHUB_ENV"
          echo "PHASE1_REPORT=$phase1_report" >> "$GITHUB_ENV"
          echo "PHASE1_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "PHASE1_SOURCE_RUN_ID=$source_run_id" >> "$GITHUB_ENV"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Gate phase 2 on a complete, healthy, staging-only phase 1
        id: phase1_gate
        if: steps.early_control.outputs.no_op != 'true'
        env:
          EXPECTED_PHASE1_COHORT_HASH: ${{ steps.early_control.outputs.expected_cohort_hash }}
        shell: bash
        run: |
          python - "$PHASE1_DB" "$PHASE1_REPORT" "$EXPECTED_PHASE1_COHORT_HASH" <<'PY'
          import json
          import sqlite3
          import sys
          from pathlib import Path

          database_path = Path(sys.argv[1])
          report = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected_cohort_hash = str(sys.argv[3] or "")
          if report.get("complete") is not True or report.get("status") != "complete":
              raise SystemExit("Latest phase-1 v2 report is not complete")
          if report.get("staging_only") is not True or report.get("canonical_written") is not False:
              raise SystemExit("Phase-1 checkpoint is not staging-only")
          scope_version = (report.get("discographies") or {}).get("scope_version")
          if scope_version != "main_performer_v1":
              raise SystemExit(
                  "Latest phase-1 checkpoint has not completed the main-performer-only rescan"
              )
          uri = f"file:{database_path.resolve().as_posix()}?mode=ro"
          with sqlite3.connect(uri, uri=True) as database:
              check = database.execute("PRAGMA quick_check").fetchone()
              state_version = database.execute("SELECT value FROM meta WHERE key='state_version'").fetchone()
              scope_marker = database.execute(
                  "SELECT value FROM meta WHERE key='discography_scope_version'"
              ).fetchone()
              state_cohort_hash = database.execute(
                  "SELECT value FROM meta WHERE key='seed_ledger_hash'"
              ).fetchone()
          report_cohort_hash = str((report.get("seed_ledger") or {}).get("cohort_hash") or "")
          if expected_cohort_hash and (
              report_cohort_hash != expected_cohort_hash
              or not state_cohort_hash
              or str(state_cohort_hash[0] or "") != expected_cohort_hash
          ):
              raise SystemExit(
                  "Restored Phase-1 state does not match the triggering completion cohort"
              )
          if (
              not check
              or check[0] != "ok"
              or not state_version
              or state_version[0] != "2"
              or not scope_marker
              or scope_marker[0] != "main_performer_v1"
          ):
              raise SystemExit(
                  "Invalid phase-1 v2 SQLite checkpoint: "
                  f"{check!r}, {state_version!r}, scope={scope_marker!r}"
              )
          print("Phase-1 v2 is complete and remains read-only")
          PY
          sha256sum "$PHASE1_DB" | cut -d' ' -f1 > "$RUNNER_TEMP/phase1-before.sha256"

      - name: Restore the latest small private phase-2 checkpoint
        id: restore_phase2
        if: steps.early_control.outputs.no_op != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$PHASE2_DIR"
          listing="$RUNNER_TEMP/soundcharts-fal-phase2-artifacts.json"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PHASE2_STATE_ARTIFACT}&per_page=100" \
            --output "$listing"
          selected="$(jq -c '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last // empty' "$listing")"
          if [[ -z "$selected" || "$selected" == "null" ]]; then
            echo "PHASE2_BOOTSTRAP_SOURCE=phase1-v2-new-private-queue" >> "$GITHUB_ENV"
            echo "No phase-2 state exists yet; initializing a separate small checkpoint"
            exit 0
          fi
          archive_url="$(jq -r '.archive_download_url // empty' <<<"$selected")"
          source_run_id="$(jq -r '.workflow_run.id // empty' <<<"$selected")"
          test -n "$archive_url"
          archive="$RUNNER_TEMP/soundcharts-fal-phase2-state.zip"
          restore_dir="$RUNNER_TEMP/soundcharts-fal-phase2-restore"
          mkdir -p "$restore_dir"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$archive_url" --output "$archive"
          unzip -o -q "$archive" -d "$restore_dir"
          restored="$(find "$restore_dir" -type f -name 'soundcharts-fal-phase2-state-v3.sqlite3' -print -quit)"
          restored_report="$(find "$restore_dir" -type f -name 'soundcharts-fal-phase2-report-v4.json' -print -quit)"
          test -n "$restored"
          test -s "$restored"
          test -n "$restored_report"
          test -s "$restored_report"
          python - "$restored" "$restored_report" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          database_path = Path(sys.argv[1])
          report = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          handoff = report.get("handoff") or {}
          expected_hash = str(handoff.get("phase2_state_sha256") or "")
          expected_bytes = int(handoff.get("phase2_state_bytes") or 0)
          actual_hash = hashlib.sha256(database_path.read_bytes()).hexdigest()
          actual_bytes = database_path.stat().st_size
          if bool(expected_hash) != bool(expected_bytes):
              raise SystemExit("Restored FAL phase-2 report contains incomplete state proof")
          if expected_hash and (expected_hash != actual_hash or expected_bytes != actual_bytes):
              raise SystemExit(
                  "Restored FAL phase-2 state does not match its verified report "
                  f"(hash={actual_hash}, bytes={actual_bytes})"
              )
          if not expected_hash:
              print("Migrating legacy FAL phase-2 state into the verified v5 handoff")
          PY
          cp "$restored" "$PHASE2_DB"
          echo "PHASE2_BOOTSTRAP_SOURCE=phase2-v3" >> "$GITHUB_ENV"
          echo "PHASE2_BOOTSTRAP_RUN_ID=$source_run_id" >> "$GITHUB_ENV"

      - name: Build the bounded recent queue without Soundcharts authentication
        id: preflight
        if: steps.early_control.outputs.no_op != 'true'
        shell: bash
        run: |
          zero_yield_arg=()
          if [[ "${{ steps.plan.outputs.continue_zero_yield }}" == "true" ]]; then
            zero_yield_arg+=(--continue-zero-yield)
          fi
          python scan_soundcharts_fal_phase2.py \
            --phase1-state "$PHASE1_DB" \
            --phase1-source-id "$PHASE1_ARTIFACT_ID" \
            --state "$PHASE2_DB" \
            --report "$REPORT_JSON" \
            --max-requests "${{ steps.plan.outputs.max_requests }}" \
            --max-new-queue "${{ steps.plan.outputs.max_new_queue }}" \
            --active-queue-cap "$ACTIVE_QUEUE_CAP" \
            --recent-days "$RECENT_DAYS" \
            --min-lifetime-streams "$TRACK_MIN_LIFETIME_STREAMS" \
            --quota-reserve "$QUOTA_RESERVE" \
            --maintenance-daily-requests "$MAINTENANCE_DAILY_REQUESTS" \
            --maintenance-through "$MAINTENANCE_THROUGH" \
            --canary-min-sample "$CANARY_MIN_SAMPLE" \
            --workers "$WORKERS" \
            "${zero_yield_arg[@]}" \
            --dry-run

      - name: Decide whether the canary may spend quota
        id: should_scan
        if: steps.early_control.outputs.no_op != 'true'
        shell: bash
        run: |
          python - "$REPORT_JSON" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          work = report.get("work") or {}
          active = int(work.get("active") or 0)
          artist_active = int(work.get("artist_gate_active") or 0)
          stream_active = int(work.get("track_stream_active") or 0)
          paused = bool(((report.get("details") or {}).get("zero_yield_schedule_paused")))
          run = active > 0 and (artist_active > 0 or stream_active > 0 or not paused)
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"run={'true' if run else 'false'}\n")
              output.write(f"active={active}\n")
              output.write(f"artist_active={artist_active}\n")
              output.write(f"stream_active={stream_active}\n")
              output.write(f"paused={'true' if paused else 'false'}\n")
          print(
              f"phase2 active={active}, artist-gate active={artist_active}, "
              f"stream-gate active={stream_active}, zero-yield paused={paused}"
          )
          PY

      - name: Persist the no-quota phase-1 handoff when paid work is idle
        id: phase2_handoff
        if: steps.early_control.outputs.no_op != 'true' && steps.should_scan.outputs.run != 'true'
        shell: bash
        run: |
          zero_yield_arg=()
          if [[ "${{ steps.plan.outputs.continue_zero_yield }}" == "true" ]]; then
            zero_yield_arg+=(--continue-zero-yield)
          fi
          python scan_soundcharts_fal_phase2.py \
            --phase1-state "$PHASE1_DB" \
            --phase1-source-id "$PHASE1_ARTIFACT_ID" \
            --state "$PHASE2_DB" \
            --report "$REPORT_JSON" \
            --max-requests 0 \
            --max-new-queue "${{ steps.plan.outputs.max_new_queue }}" \
            --active-queue-cap "$ACTIVE_QUEUE_CAP" \
            --recent-days "$RECENT_DAYS" \
            --min-lifetime-streams "$TRACK_MIN_LIFETIME_STREAMS" \
            --canary-min-sample "$CANARY_MIN_SAMPLE" \
            "${zero_yield_arg[@]}" \
            --prepare-only

      - name: Enrich the bounded private phase-2 canary
        id: phase2_scan
        if: steps.should_scan.outputs.run == 'true'
        timeout-minutes: 90
        env:
          PYTHONUNBUFFERED: '1'
          SOUNDCHARTS_CLIENT_ID: ${{ secrets.SOUNDCHARTS_CLIENT_ID }}
          SOUNDCHARTS_CLIENT_SECRET: ${{ secrets.SOUNDCHARTS_CLIENT_SECRET }}
          SOUNDCHARTS_TEAM_ID: dsomoguy-api
        shell: bash
        run: |
          zero_yield_arg=()
          if [[ "${{ steps.plan.outputs.continue_zero_yield }}" == "true" ]]; then
            zero_yield_arg+=(--continue-zero-yield)
          fi
          exec python scan_soundcharts_fal_phase2.py \
            --phase1-state "$PHASE1_DB" \
            --phase1-source-id "$PHASE1_ARTIFACT_ID" \
            --state "$PHASE2_DB" \
            --report "$REPORT_JSON" \
            --max-requests "${{ steps.plan.outputs.max_requests }}" \
            --max-new-queue "${{ steps.plan.outputs.max_new_queue }}" \
            --active-queue-cap "$ACTIVE_QUEUE_CAP" \
            --recent-days "$RECENT_DAYS" \
            --min-lifetime-streams "$TRACK_MIN_LIFETIME_STREAMS" \
            --quota-reserve "$QUOTA_RESERVE" \
            --maintenance-daily-requests "$MAINTENANCE_DAILY_REQUESTS" \
            --maintenance-through "$MAINTENANCE_THROUGH" \
            --canary-min-sample "$CANARY_MIN_SAMPLE" \
            --workers "$WORKERS" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --request-journal "$REQUEST_JOURNAL" \
            "${zero_yield_arg[@]}"

      - name: Preserve an honest phase-2 report after runner interruption
        id: honest_report
        if: always() && steps.early_control.outputs.no_op != 'true' && steps.preflight.outcome == 'success'
        env:
          SCAN_OUTCOME: ${{ steps.phase2_scan.outcome }}
          HANDOFF_OUTCOME: ${{ steps.phase2_handoff.outcome }}
        shell: bash
        run: |
          outcome="${SCAN_OUTCOME:-skipped}"
          handoff_outcome="${HANDOFF_OUTCOME:-skipped}"
          if [[ "$outcome" == "skipped" && "$handoff_outcome" != "success" ]]; then
            echo "Neither the paid scan nor the no-quota phase-1 handoff persisted the real phase-2 state" >&2
            exit 1
          fi
          if [[ "$outcome" != "success" && "$outcome" != "skipped" ]]; then
            python scan_soundcharts_fal_phase2.py \
              --phase1-state "$PHASE1_DB" \
              --state "$PHASE2_DB" \
              --report "$REPORT_JSON" \
              --active-queue-cap "$ACTIVE_QUEUE_CAP" \
              --recent-days "$RECENT_DAYS" \
              --min-lifetime-streams "$TRACK_MIN_LIFETIME_STREAMS" \
              --canary-min-sample "$CANARY_MIN_SAMPLE" \
              --recover-interrupted-report \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --request-journal "$REQUEST_JOURNAL" \
              --runner-outcome "$outcome"
          fi
          test -s "$REPORT_JSON"
          python - "$REPORT_JSON" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          report = json.loads(path.read_text(encoding="utf-8"))
          report["checkpoint"] = {
              "phase1_artifact_id": os.environ.get("PHASE1_ARTIFACT_ID"),
              "phase1_source_run_id": os.environ.get("PHASE1_SOURCE_RUN_ID"),
              "phase2_bootstrap": os.environ.get("PHASE2_BOOTSTRAP_SOURCE"),
              "phase2_source_run_id": os.environ.get("PHASE2_BOOTSTRAP_RUN_ID"),
          }
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Verify phase 1 stayed immutable and phase 2 stayed private
        id: checkpoint_guard
        if: always() && steps.early_control.outputs.no_op != 'true' && steps.honest_report.outcome == 'success'
        shell: bash
        run: |
          before="$(cat "$RUNNER_TEMP/phase1-before.sha256")"
          after="$(sha256sum "$PHASE1_DB" | cut -d' ' -f1)"
          test "$before" = "$after"
          python - "$PHASE2_DB" "$REPORT_JSON" "$PHASE1_ARTIFACT_ID" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import sqlite3
          import sys
          from pathlib import Path

          with sqlite3.connect(sys.argv[1]) as database:
              check = database.execute("PRAGMA quick_check").fetchone()
              source_row = database.execute(
                  "SELECT value FROM meta WHERE key='fal_phase2_phase1_source_id'"
              ).fetchone()
              database_work = {
                  "artist_gate_active": database.execute(
                      "SELECT COUNT(*) FROM fal_phase2_artist_gate WHERE gate_status IN ('pending','retry')"
                  ).fetchone()[0],
                  "track_detail_active": database.execute(
                      "SELECT COUNT(*) FROM fal_phase2_queue WHERE queue_status IN ('pending','retry')"
                  ).fetchone()[0],
                  "track_stream_active": database.execute(
                      "SELECT COUNT(*) FROM fal_phase2_stream_gate WHERE gate_status IN ('pending','retry')"
                  ).fetchone()[0],
              }
              database_details = database.execute(
                  "SELECT COUNT(*) FROM fal_phase2_details"
              ).fetchone()[0]
              database_bulk_remaining = database.execute(
                  "SELECT COUNT(*) FROM fal_phase2_artist_gate WHERE gate_status='eligible' AND bulk_complete=0"
              ).fetchone()[0]
          if not check or check[0] != "ok":
              raise SystemExit(f"Invalid phase-2 checkpoint: {check!r}")
          report = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected_phase1 = str(sys.argv[3] or "").strip()
          database_source = str(source_row[0] if source_row else "").strip()
          report_source = str(
              ((report.get("source_checkpoint") or {}).get("phase1_source_id") or "")
          ).strip()
          report_artifact = str(
              ((report.get("checkpoint") or {}).get("phase1_artifact_id") or "")
          ).strip()
          if not expected_phase1 or {
              database_source,
              report_source,
              report_artifact,
          } != {expected_phase1}:
              raise SystemExit(
                  "Phase-2 handoff does not match the restored immutable phase-1 artifact "
                  f"(expected={expected_phase1!r}, database={database_source!r}, "
                  f"report={report_source!r}, checkpoint={report_artifact!r})"
              )
          report_work = report.get("work") or {}
          for key, value in database_work.items():
              if int(report_work.get(key) or 0) != int(value):
                  raise SystemExit(
                      f"Phase-2 report/state mismatch for {key}: "
                      f"report={report_work.get(key)!r}, database={value!r}"
                  )
          if int(report_work.get("active") or 0) != sum(database_work.values()):
              raise SystemExit("Phase-2 report/state mismatch for total active work")
          if int((report.get("details") or {}).get("enriched") or 0) != database_details:
              raise SystemExit("Phase-2 report/state mismatch for enriched details")
          if int((report.get("artist_gate") or {}).get("eligible_bulk_remaining") or 0) != database_bulk_remaining:
              raise SystemExit("Phase-2 report/state mismatch for eligible artist bulks")
          if report.get("staging_only") is not True:
              raise SystemExit("Phase 2 must remain staging-only")
          if report.get("canonical_written") is not False or report.get("dashboard_written") is not False:
              raise SystemExit("Phase 2 attempted a canonical/dashboard write")
          if ((report.get("details") or {}).get("unknowns_are_never_accepted")) is not True:
              raise SystemExit("Unknown metadata guard is missing")
          stream_gate = report.get("stream_gate") or {}
          if int(stream_gate.get("minimum_streams") or 0) != 100000:
              raise SystemExit("The 100k lifetime-stream gate is missing")
          if stream_gate.get("missing_or_ambiguous_never_passes") is not True:
              raise SystemExit("Unknown Spotify streams must never pass")
          with sqlite3.connect(sys.argv[1]) as database:
              invalid = database.execute(
                  """SELECT COUNT(*) FROM fal_phase2_stream_gate
                       WHERE gate_status='eligible'
                         AND (streams_total IS NULL OR streams_total<100000)"""
              ).fetchone()[0]
          if invalid:
              raise SystemExit(f"Invalid 100k stream-gate rows: {invalid}")
          report["handoff"] = {
              "phase1_artifact_id": expected_phase1,
              "phase1_source_id": database_source,
              "phase2_state_verified": True,
              "phase2_state_sha256": hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest(),
              "phase2_state_bytes": Path(sys.argv[1]).stat().st_size,
              "verified_at": dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          Path(sys.argv[2]).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          test -z "$(git status --porcelain)"

      - name: Persist the small private resumable phase-2 state
        id: state_upload
        if: always() && steps.checkpoint_guard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: soundcharts-fal-phase2-state-v3
          path: |
            ${{ env.PHASE2_DB }}
            ${{ env.REPORT_JSON }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Preserve the immutable FAL phase-2 run report
        if: always() && steps.checkpoint_guard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: soundcharts-fal-phase2-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_JSON }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Persist the small phase-2 pause/completion control
        id: control_upload
        if: >-
          always() &&
          (steps.early_control.outputs.no_op == 'true' ||
           steps.state_upload.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: soundcharts-fal-phase2-control-v5
          path: ${{ env.REPORT_JSON }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Keep only the two newest mutable phase-2 state artifacts
        if: always() && steps.state_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          listing="$RUNNER_TEMP/soundcharts-fal-phase2-state-artifacts.json"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PHASE2_STATE_ARTIFACT}&per_page=100" \
            --output "$listing"
          mapfile -t stale_ids < <(jq -r \
            '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[2:][] | .id' \
            "$listing")
          for artifact_id in "${stale_ids[@]}"; do
            curl --fail --silent --show-error --location \
              --request DELETE \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
