name: Refresh Spotify browsing catalogue

on:
  push:
    branches: [main]
    paths:
      - 'spotify/index.html'
      - 'Spotify_Performance_data.js'
      - 'Spotify_Performance_tracks/**'
      - 'spotify-catalogue-baseline.csv'
      - 'spotify-catalogue-baseline.json'
      - 'spotify-catalogue-exclusions.json'
      - 'spotify-protected-review-cohorts.json'
      - 'build_spotify_browse_catalogue.py'
      - 'build_spotify_instant_runtime.js'
      - 'Spotify_Radar_data.js'
      - 'Spotify_Lofi_Relations_data.js'
      - 'spotify_counter_integrity.py'
      - 'repair_spotify_counter_integrity.py'
      - 'spotify_performance_store.py'
      - 'spotify/dashboard.js'
      - 'spotify/instant.js'
      - 'spotify/instant.css'
      - 'spotify/track-analytics.js'
      - 'spotify/track-analytics.css'
      - 'spotify/playlist-analytics.js'
      - 'spotify/playlist-analytics.css'
      - 'spotify/player.js'
      - 'spotify/player.css'
      - 'tests/test_build_spotify_browse_catalogue.py'
      - 'tests/test_spotify_counter_integrity.py'
      - 'tests/test_repair_spotify_counter_integrity.py'
      - 'tests/spotify_counter_integrity_cases.json'
      - 'tests/test_spotify_counter_integrity.js'
      - 'tests/test_spotify_data_through.js'
      - 'tests/test_spotify_catalogue_layers.js'
      - 'tests/test_spotify_catalogue_archives.js'
      - 'tests/test_spotify_full_catalogue.js'
      - 'tests/test_spotify_custom_player.js'
      - 'tests/test_spotify_public_stream_floor.js'
      - 'tests/test_spotify_public_strict_projection.js'
      - 'tests/test_spotify_track_analytics_interactions.js'
      - 'tests/test_spotify_daily_chart_integrity.js'
      - 'tests/test_spotify_instant_runtime.js'
      - 'tests/test_spotify_instant_filters_runtime.js'
      - 'tests/test_spotify_track_analytics_runtime.js'
      - 'tests/test_spotify_playlist_analytics_runtime.js'
      - '.github/workflows/refresh-spotify-browse-catalogue.yml'
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even when the browse catalogue already matches the active snapshot'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: refresh-spotify-browsing-catalogue
  cancel-in-progress: true

jobs:
  gate:
    name: Check active browse-catalogue source
    runs-on: ubuntu-latest
    outputs:
      run_refresh: ${{ steps.freshness.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "push" || "$FORCE" == "true" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            python data_freshness_watchdog.py \
              --target spotify_browse \
              --github-output "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run_refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build affiliated catalogue plus strict external discoveries
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          current="$(python prepare_soundcharts_snapshot.py browse-source --catalogue Spotify_Browse_Catalogue_data.js)"
          args=(
            --source "$current"
            --existing Spotify_Browse_Catalogue_data.js
            --output Spotify_Browse_Catalogue_data.js
            --minimum-tracks 10000
            --performance Spotify_Performance_data.js
            --strict-rebased
            --trusted-catalogue spotify-catalogue-baseline.csv
            --trusted-artist-seeds spotify-catalogue-baseline.json
            --exclusions spotify-catalogue-exclusions.json
            --protected-review-cohorts spotify-protected-review-cohorts.json
          )
          python build_spotify_browse_catalogue.py "${args[@]}"

      - name: Validate the two-layer contract
        run: |
          python -m py_compile build_spotify_browse_catalogue.py spotify_counter_integrity.py repair_spotify_counter_integrity.py spotify_performance_store.py
          python -m unittest tests/test_build_spotify_browse_catalogue.py tests/test_spotify_counter_integrity.py tests/test_repair_spotify_counter_integrity.py -v
          python repair_spotify_counter_integrity.py --performance Spotify_Performance_data.js --browse Spotify_Browse_Catalogue_data.js --check
          node build_spotify_instant_runtime.js
          node tests/test_spotify_playlist_analytics_runtime.js
          node --check spotify/dashboard.js
          node --check spotify/instant.js
          node --check spotify/track-analytics.js
          node --check spotify/player.js
          node --check spotify/coverage.js
          node tests/test_dashboard_genre_filter.js
          node tests/test_spotify_full_catalogue.js
          node tests/test_spotify_custom_player.js
          node tests/test_spotify_catalogue_layers.js
          node tests/test_spotify_catalogue_archives.js
          node tests/test_spotify_public_stream_floor.js
          node tests/test_spotify_public_strict_projection.js
          node tests/test_spotify_track_analytics_interactions.js
          node tests/test_spotify_daily_chart_integrity.js
          node tests/test_spotify_counter_integrity.js
          node tests/test_spotify_data_through.js
          node tests/test_spotify_instant_runtime.js
          node tests/test_spotify_instant_filters_runtime.js
          node tests/test_spotify_track_analytics_runtime.js
          git diff --check

      - name: Publish only when the catalogue changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Spotify_Browse_Catalogue_data.js Spotify_Lofi_Relations_data.js Spotify_Instant_data.js Spotify_Catalogue_data.js; then
            echo 'Browsing catalogue already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Spotify_Browse_Catalogue_data.js Spotify_Lofi_Relations_data.js Spotify_Instant_data.js Spotify_Catalogue_data.js
          git commit -m 'data: refresh Spotify browsing catalogue'
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              published_sha="$(git rev-parse HEAD)"
              python trigger_pages_deployment.py \
                --repository "$GITHUB_REPOSITORY" \
                --sha "$published_sha"
              exit 0
            fi
            sleep 5
          done
          exit 1
