name: Refresh channel radar

on:
  schedule:
    - cron: '37 6 1 * *'
  push:
    branches: [main]
    paths:
      - 'refresh_channels_monthly.py'
      - '.github/workflows/refresh-channel-radar.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when the current month is already healthy'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: refresh-channel-radar
  cancel-in-progress: false

jobs:
  gate:
    name: Check monthly channel freshness
    runs-on: ubuntu-latest
    outputs:
      run_refresh: ${{ steps.freshness.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "push" || "$FORCE" == "true" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            schedule_arg=""
            if [[ "$EVENT_NAME" == "schedule" ]]; then schedule_arg="--scheduled-check"; fi
            python data_freshness_watchdog.py \
              --target youtube_channels \
              $schedule_arg \
              --github-output "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run_refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install --disable-pip-version-check --upgrade yt-dlp openpyxl
      - name: Refresh monthly public channel metrics
        env:
          PYTHONUNBUFFERED: '1'
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python refresh_channels_monthly.py
      - name: Commit channel snapshot and history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Lofi_Radar_chx.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh monthly YouTube channel metrics"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              published_sha="$(git rev-parse HEAD)"
              python trigger_pages_deployment.py \
                --repository "$GITHUB_REPOSITORY" \
                --sha "$published_sha"
              exit 0
            fi
            sleep 5
          done
          exit 1
