name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      requested_sha:
        description: 'Main commit whose publication requested this coalesced deployment'
        required: true
        type: string
      retry_attempt:
        description: 'Deprecated compatibility input; immutable deployments are not retried under another SHA'
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Every source (human merge or bot dispatch) shares one lane. A newer main
# revision supersedes an older queued build instead of creating a Pages
# deployment backlog that can remain in deployment_queued until it times out.
concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Build latest main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      resolved_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # deploy-pages always publishes under github.sha. Never let a
          # workflow-dispatch run float to a newer checkout than that identity.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: revision
        name: Resolve and require one immutable Pages revision
        env:
          REQUESTED_SHA: ${{ inputs.requested_sha }}
          RUN_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          resolved_sha="$(git rev-parse HEAD)"
          if [[ ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$resolved_sha" != "$RUN_SHA" ]]; then
            echo "Pages run identity diverged: run=$RUN_SHA checkout=$resolved_sha" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$resolved_sha" origin/main; then
            echo "Pages run commit is not part of main: $resolved_sha" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid requested_sha: $REQUESTED_SHA" >&2
              exit 1
            fi
            if [[ "$REQUESTED_SHA" != "$RUN_SHA" ]]; then
              echo "Pages dispatch identity diverged: requested=$REQUESTED_SHA run=$RUN_SHA" >&2
              exit 1
            fi
          fi
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Building immutable Pages revision $resolved_sha."

      - uses: actions/configure-pages@v5

      # Keep the same Jekyll build semantics as the former branch-based Pages
      # deployment while making the deploy trigger explicit and controllable.
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ steps.revision.outputs.sha }}

      - name: Require the built revision to remain immutable
        env:
          RESOLVED_SHA: ${{ steps.revision.outputs.sha }}
          BUILD_REVISION: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$RESOLVED_SHA" ]] || [[ "$BUILD_REVISION" != "$RESOLVED_SHA" ]]; then
            echo "Pages build identity diverged: checkout=$checkout_sha build=$BUILD_REVISION resolved=$RESOLVED_SHA" >&2
            exit 1
          fi

      - name: Prune historical and private Pages payloads
        shell: bash
        run: |
          # jekyll-build-pages runs in a container and leaves _site owned by
          # root. Restore ownership to the runner before the fail-closed
          # pruning step removes historical payloads.
          sudo chown -R "$(id -u):$(id -g)" ./_site
          python prune_pages_artifact.py --site-dir ./_site

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy latest main
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployment_outcome: ${{ steps.deployment.outcome }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.resolved_sha }}
          sparse-checkout: |
            cancel_stale_pages_deployments.py
          sparse-checkout-cone-mode: false

      - name: Require deploy-pages to use the built revision
        env:
          RUN_SHA: ${{ github.sha }}
          RESOLVED_SHA: ${{ needs.build.outputs.resolved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$RUN_SHA" != "$RESOLVED_SHA" ]] || [[ "$checkout_sha" != "$RESOLVED_SHA" ]]; then
            echo "Pages deploy identity diverged: run=$RUN_SHA checkout=$checkout_sha built=$RESOLVED_SHA" >&2
            exit 1
          fi

      # A newer coalesced run can cancel the runner while deploy-pages is
      # polling, leaving the server-side Pages deployment active. Inspect only
      # recent commits from main and cancel only an explicitly active Pages
      # deployment before creating the next one.
      - name: Cancel an orphaned Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_RUN_SHA: ${{ needs.build.outputs.resolved_sha }}
        shell: bash
        run: |
          python cancel_stale_pages_deployments.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref main \
            --exclude-sha "$CURRENT_RUN_SHA"

      # deploy-pages caps one polling attempt at 600,000 ms. Fail this immutable
      # revision if that attempt cannot finish; a later real main commit may
      # create the next deployment identity, but this workflow never manufactures
      # an empty revision or labels another artifact with this run's SHA.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
          timeout: 600000

      - name: Mark this Pages attempt as failed
        if: ${{ steps.deployment.outcome == 'failure' }}
        shell: bash
        run: |
          echo "This immutable Pages deployment failed; a different revision was not substituted." >&2
          exit 1
