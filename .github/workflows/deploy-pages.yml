name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "social-app/data/comment-opportunities/feed.json"
      - "social-app/data/comment-opportunities/refresh-status.json"
  workflow_dispatch:
    inputs:
      requested_sha:
        description: 'Main commit whose publication requested this coalesced deployment'
        required: true
        type: string
      retry_attempt:
        description: 'Deprecated compatibility input; immutable deployments are not retried under another SHA'
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Every source (human merge or bot dispatch) shares one lane. A newer main
# revision supersedes an older queued build instead of creating a Pages
# deployment backlog that can remain in deployment_queued until it times out.
concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Build latest main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      resolved_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout only the public Pages runtime
        uses: actions/checkout@v4
        with:
          # deploy-pages always publishes under github.sha. Never let a
          # workflow-dispatch run float to a newer checkout than that identity.
          ref: ${{ github.sha }}
          # actions/checkout combines sparse checkout with a blob:none partial
          # clone. Fetch one commit and materialize only the files served by
          # Pages instead of the multi-gigabyte historical snapshot archive.
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /*.js
            /*.json
            !/Spotify_Soundcharts_data_*.js
            !/Spotify_Performance_data.js
            !/Spotify_Radar_data.js
            !/Spotify_Selection_Contacts_data.js
            !/Spotify_Preview_Audio_data.js
            !/Spotify_Playlist_Covers_data.js
            !/Spotify_Performance_loader.js
            !/soundcharts-instrumental-cache.json
            /assets/
            /.github/workflows/
            /spotify/
            /video_history/
            /youtube_recommendation_ledger/manifest.json
            /prune_pages_artifact.py
            /_config.yml
            /social-app/
            /tests/spotify_light_bootstrap_contract.js
            /tests/test_spotify_instant_runtime.js
            /tests/test_unified_design_system.cjs
            /tests/test_unified_platform_navigation.cjs

      - id: revision
        name: Resolve and require one immutable Pages revision
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.requested_sha }}
          RUN_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          resolved_sha="$(git rev-parse HEAD)"
          if [[ ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$resolved_sha" != "$RUN_SHA" ]]; then
            echo "Pages run identity diverged: run=$RUN_SHA checkout=$resolved_sha" >&2
            exit 1
          fi
          api_sha="$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/commits/${RUN_SHA}" \
            --jq '.sha')"
          if [[ "$api_sha" != "$RUN_SHA" ]]; then
            echo "GitHub API resolved another Pages revision: run=$RUN_SHA api=$api_sha" >&2
            exit 1
          fi
          comparison_status="$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/compare/${RUN_SHA}...main" \
            --jq '.status')"
          case "$comparison_status" in
            ahead|identical) ;;
            *)
              echo "Pages run commit is not part of main: $RUN_SHA (compare status: $comparison_status)" >&2
              exit 1
              ;;
          esac
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid requested_sha: $REQUESTED_SHA" >&2
              exit 1
            fi
            if [[ "$REQUESTED_SHA" != "$RUN_SHA" ]]; then
              echo "Pages dispatch identity diverged: requested=$REQUESTED_SHA run=$RUN_SHA" >&2
              exit 1
            fi
          fi
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Building immutable Pages revision $resolved_sha."

      - name: Materialize required Soundcharts snapshots
        env:
          RUN_SHA: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_reference_re='Spotify_Soundcharts_data_[A-Za-z0-9][A-Za-z0-9._-]*\.js'
          timestamped_snapshot_re='^Spotify_Soundcharts_data_[0-9]{8}T[0-9]{4,6}Z?([._-][A-Za-z0-9._-]+)?\.js$'

          mapfile -t referenced_snapshots < <(
            grep -oE "$snapshot_reference_re" spotify/index.html | sort -u
          )
          if (( ${#referenced_snapshots[@]} == 0 )); then
            echo "The lightweight Spotify runtime does not publish a Soundcharts snapshot; nothing to materialize."
            exit 0
          fi

          # The pruning/recovery contract keeps the newest staged snapshot in
          # addition to the active reference so it can be verified before the
          # index is promoted. Inspect only the commit tree; no blob is fetched.
          latest_snapshot="$(
            git ls-tree --name-only "$RUN_SHA" |
              grep -E "$timestamped_snapshot_re" |
              sort |
              tail -n 1
          )"
          if [[ -z "$latest_snapshot" ]]; then
            echo "No versioned Soundcharts snapshot exists at $RUN_SHA." >&2
            exit 1
          fi

          required_snapshots=("${referenced_snapshots[@]}" "$latest_snapshot")
          for snapshot in "${required_snapshots[@]}"; do
            if [[ ! "$snapshot" =~ $timestamped_snapshot_re ]]; then
              echo "Invalid Soundcharts snapshot name: $snapshot" >&2
              exit 1
            fi
            tree_kind="$(git ls-tree "$RUN_SHA" -- "$snapshot" | awk '{print $1 " " $2}')"
            if [[ "$tree_kind" != "100644 blob" && "$tree_kind" != "100755 blob" ]]; then
              echo "Soundcharts snapshot is not a regular tracked file: $snapshot" >&2
              exit 1
            fi
          done

          printf '/%s\n' "${required_snapshots[@]}" |
            sort -u |
            git sparse-checkout add --stdin
          for snapshot in "${required_snapshots[@]}"; do
            if [[ ! -f "$snapshot" || -L "$snapshot" ]]; then
              echo "Soundcharts snapshot was not materialized safely: $snapshot" >&2
              exit 1
            fi
          done
          echo "Materialized active and staged Soundcharts snapshots only."

      - name: Set up Node.js for Social Radar
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Validate the shared Radar header
        shell: bash
        run: |
          set -euo pipefail
          node tests/test_unified_design_system.cjs
          node tests/test_unified_platform_navigation.cjs

      - name: Build the lightweight Spotify runtime
        shell: bash
        run: |
          set -euo pipefail
          node build_spotify_instant_runtime.js
          test -f Spotify_Instant_data.js
          test -f Spotify_Catalogue_data.js
          node tests/test_spotify_instant_runtime.js

      - name: Build the Social Radar runtime
        working-directory: social-app
        env:
          LOFI_SOCIAL_BASE_PATH: /youtube-radar-kx9v2m/social/
          LOFI_SOCIAL_OUT_DIR: ../social
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build:preview
          test -f ../social/index.html
          test -f ../social/platforms/spotify.svg
          cmp -s ../assets/platform-spotify.svg ../social/platforms/spotify.svg
          grep -F 'rel="preload" as="style"' ../social/index.html
          grep -F "this.rel='stylesheet'" ../social/index.html
          grep -F '<noscript><link' ../social/index.html
          grep -R -F 'platforms/spotify.svg?v=20260825-logo-v2' ../social/assets
          test -f ../social/data/trends/feed.json
          test -f ../social/data/audio-trends/feed.json
          test -f ../social/data/comment-opportunities/feed.json

      - uses: actions/configure-pages@v5

      # Keep the same Jekyll build semantics as the former branch-based Pages
      # deployment while making the deploy trigger explicit and controllable.
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ steps.revision.outputs.sha }}

      - name: Require the built revision to remain immutable
        env:
          RESOLVED_SHA: ${{ steps.revision.outputs.sha }}
          BUILD_REVISION: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$RESOLVED_SHA" ]] || [[ "$BUILD_REVISION" != "$RESOLVED_SHA" ]]; then
            echo "Pages build identity diverged: checkout=$checkout_sha build=$BUILD_REVISION resolved=$RESOLVED_SHA" >&2
            exit 1
          fi

      - name: Prune historical and private Pages payloads
        shell: bash
        run: |
          # jekyll-build-pages runs in a container and leaves _site owned by
          # root. Restore ownership to the runner before the fail-closed
          # pruning step removes historical payloads.
          sudo chown -R "$(id -u):$(id -g)" ./_site
          python prune_pages_artifact.py --site-dir ./_site

      - name: Require the unified public surface only
        shell: bash
        run: |
          set -euo pipefail
          test -f ./_site/index.html
          test -f ./_site/spotify/index.html
          test -f ./_site/social/index.html
          test -f ./_site/assets/platform-spotify.svg
          test -f ./_site/social/platforms/spotify.svg
          cmp -s ./_site/assets/platform-spotify.svg ./_site/social/platforms/spotify.svg
          grep -F 'platform-spotify.svg?v=20260825-logo-v2' ./_site/index.html
          grep -F 'platform-spotify.svg?v=20260825-logo-v2' ./_site/spotify/index.html
          grep -R -F 'platforms/spotify.svg?v=20260825-logo-v2' ./_site/social/assets
          test ! -e ./_site/social-app
          if grep -R -F 'https://dim75017.github.io/lofi-social-radar-preview/' ./_site/social || \
             grep -R -F 'raw.githubusercontent.com/dim75017/lofi-social-radar-preview/main/' ./_site/social; then
            echo "The Social runtime still references a legacy public data base." >&2
            exit 1
          fi

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy latest main
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployment_outcome: ${{ steps.deployment.outcome }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.resolved_sha }}
          sparse-checkout: |
            cancel_stale_pages_deployments.py
          sparse-checkout-cone-mode: false

      - name: Require deploy-pages to use the built revision
        env:
          RUN_SHA: ${{ github.sha }}
          RESOLVED_SHA: ${{ needs.build.outputs.resolved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$RUN_SHA" != "$RESOLVED_SHA" ]] || [[ "$checkout_sha" != "$RESOLVED_SHA" ]]; then
            echo "Pages deploy identity diverged: run=$RUN_SHA checkout=$checkout_sha built=$RESOLVED_SHA" >&2
            exit 1
          fi

      # A newer coalesced run can cancel the runner while deploy-pages is
      # polling, leaving the server-side Pages deployment active. Inspect only
      # recent commits from main and cancel only an explicitly active Pages
      # deployment before creating the next one.
      - name: Cancel an orphaned Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_RUN_SHA: ${{ needs.build.outputs.resolved_sha }}
        shell: bash
        run: |
          python cancel_stale_pages_deployments.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref main \
            --exclude-sha "$CURRENT_RUN_SHA"

      # deploy-pages caps one polling attempt at 600,000 ms. Fail this immutable
      # revision if that attempt cannot finish; a later real main commit may
      # create the next deployment identity, but this workflow never manufactures
      # an empty revision or labels another artifact with this run's SHA.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
          timeout: 600000

      - name: Mark this Pages attempt as failed
        if: ${{ steps.deployment.outcome == 'failure' }}
        shell: bash
        run: |
          echo "This immutable Pages deployment failed; a different revision was not substituted." >&2
          exit 1
