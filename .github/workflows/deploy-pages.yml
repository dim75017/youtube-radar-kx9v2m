name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      requested_sha:
        description: 'Main commit whose publication requested this coalesced deployment'
        required: false
        type: string
      retry_attempt:
        description: 'Internal bounded recovery attempt (0-3)'
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Every source (human merge or bot dispatch) shares one lane. A newer main
# revision supersedes an older queued build instead of creating a Pages
# deployment backlog that can remain in deployment_queued until it times out.
concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Build latest main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require the requested revision to belong to main
        if: github.event_name == 'workflow_dispatch' && inputs.requested_sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.requested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid requested_sha: $REQUESTED_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git cat-file -e "$REQUESTED_SHA^{commit}" 2>/dev/null; then
            echo "Requested commit is not available: $REQUESTED_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" origin/main; then
            echo "Requested commit is not part of main: $REQUESTED_SHA" >&2
            exit 1
          fi
          echo "Coalescing request for $REQUESTED_SHA onto latest main $(git rev-parse origin/main)."

      - uses: actions/configure-pages@v5

      # Keep the same Jekyll build semantics as the former branch-based Pages
      # deployment while making the deploy trigger explicit and controllable.
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy latest main
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployment_outcome: ${{ steps.deployment.outcome }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages caps one polling attempt at 600,000 ms. A deployment that
      # reaches that cap is cancelled server-side, and retrying the same SHA is
      # cancelled immediately. The recovery job below therefore creates one
      # unique empty main commit before each bounded redispatch.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
          timeout: 600000

      - name: Mark this Pages attempt as failed
        if: ${{ steps.deployment.outcome == 'failure' }}
        shell: bash
        run: |
          echo "This Pages attempt failed; bounded recovery will renew the deployment revision." >&2
          exit 1

  recover:
    name: Renew cancelled Pages deployment
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.outputs.deployment_outcome == 'failure' && fromJSON(inputs.retry_attempt || '0') < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create a unique main revision for the next Pages deployment
        id: renewal
        env:
          ROOT_REQUESTED_SHA: ${{ inputs.requested_sha || github.sha }}
          CURRENT_RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CURRENT_RETRY_ATTEMPT" =~ ^[0-2]$ ]]; then
            echo "Invalid retry_attempt: $CURRENT_RETRY_ATTEMPT" >&2
            exit 1
          fi
          next_retry=$((CURRENT_RETRY_ATTEMPT + 1))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pushed=false
          for push_attempt in 1 2 3; do
            git fetch --no-tags origin main
            git checkout --detach origin/main
            git commit --allow-empty -m "chore(pages): renew deployment ${next_retry}/3 for ${ROOT_REQUESTED_SHA:0:12}"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Main advanced while renewing Pages; retrying (${push_attempt}/3)."
          done
          if [[ "$pushed" != true ]]; then
            echo "Unable to create a fresh main revision for Pages." >&2
            exit 1
          fi

          echo "retry_attempt=$next_retry" >> "$GITHUB_OUTPUT"
          echo "retry_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Redispatch Pages with the original requested revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROOT_REQUESTED_SHA: ${{ inputs.requested_sha || github.sha }}
          NEXT_RETRY_ATTEMPT: ${{ steps.renewal.outputs.retry_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python trigger_pages_deployment.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$ROOT_REQUESTED_SHA" \
            --retry-attempt "$NEXT_RETRY_ATTEMPT"

  exhausted:
    name: Fail after bounded Pages recovery
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.outputs.deployment_outcome == 'failure' && fromJSON(inputs.retry_attempt || '0') >= 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report exhausted Pages retries
        shell: bash
        run: |
          echo "GitHub Pages failed after the initial attempt and three fresh-revision retries." >&2
          exit 1
