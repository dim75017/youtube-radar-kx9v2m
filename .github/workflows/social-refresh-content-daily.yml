name: Social · Refresh content inventory daily

on:
  workflow_dispatch:
  schedule:
    - cron: "7 3 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: social-public-history-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: social-app
    steps:
      - name: Check out the unified radar
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned public metadata collector
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-compile
          --target work/ytdeps
          yt-dlp==2026.7.4

      - name: Validate partial collection safety
        run: python -m unittest tests.test_public_history_collector

      - name: Refresh YouTube content and metrics
        run: python scripts/collect_public_history.py --platform youtube

      - name: Refresh TikTok content and metrics
        run: python scripts/collect_public_history.py --platform tiktok

      - name: Synchronize the lightweight public summary
        run: node --experimental-strip-types scripts/sync-public-history-summary.mjs

      - name: Validate content inventory and metric history
        run: >-
          node --experimental-strip-types --test
          tests/public-history-scope.test.mjs
          tests/live-metric-history.test.mjs

      - name: Publish only verified content deltas
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lofi-social-radar-bot"
          git config user.email "lofi-social-radar-bot@users.noreply.github.com"
          git add data/public-history.json data/public-history-summary.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh Social content inventory"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Publish the refreshed content on GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main \
            -f requested_sha="$(git rev-parse HEAD)"
