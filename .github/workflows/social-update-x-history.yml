name: Social · Update X history incrementally

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"

permissions:
  contents: write

concurrency:
  # Shared with the Instagram collector because both can update public-history.
  group: social-public-history-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: social-app
    steps:
      - name: Check out radar source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check required secrets before any paid read
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          test -n "$X_BEARER_TOKEN" || { echo "Missing X_BEARER_TOKEN" >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate collectors
        run: |
          node --check scripts/collect_x_full_archive.mjs
          node --check scripts/import_x_progress_to_public_history.mjs
          node --test tests/x-incremental-observations.test.mjs

      - name: Read only posts newer than the completed archive
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node scripts/collect_x_full_archive.mjs --incremental

      - name: Import the new X rows
        run: node scripts/import_x_progress_to_public_history.mjs

      - name: Detect source data changes
        id: source_diff
        shell: bash
        run: |
          if git diff --quiet -- data/public-history.json data/public-history-summary.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new X posts to the source repository
        if: steps.source_diff.outputs.changed == 'true'
        run: |
          git config user.name "lofi-social-radar-bot"
          git config user.email "lofi-social-radar-bot@users.noreply.github.com"
          git add data/public-history.json data/public-history-summary.json
          git commit -m "Update X history"
          git pull --rebase origin main
          git push origin HEAD:main
