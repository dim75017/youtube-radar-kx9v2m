name: Refresh Spotify playlist followers daily

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-playlist-followers.yml'
      - 'build_spotify_playlist_analytics.py'
      - 'prepare_soundcharts_snapshot.py'
  schedule:
    # Primary cloud pass after the large A&R workflow, plus an independent
    # same-day catch-up. Neither requires Dim's computer to be awake.
    - cron: '47 6 * * *'
    - cron: '47 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh again even when today is already complete'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

# This exact group is shared with the main Soundcharts collector. It prevents
# an older long-running snapshot from overwriting a newer follower history.
concurrency:
  group: refresh-soundcharts-ar-collection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  followers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest published history
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate follower collector regressions
        run: |
          python -m unittest tests.test_spotify_performance_store tests.test_playlist_follower_daily_integrity
          node tests/test_spotify_playlist_follower_windows.js

      - name: Validate and shard performance storage before paid collection
        run: >-
          python refresh_soundcharts_daily.py
          --mode storage
          --performance Spotify_Performance_data.js
          --history-dir soundcharts-history

      - name: Measure today's visible playlist coverage
        id: coverage_before
        shell: bash
        run: |
          # The guard reads the big10k cohort and its hist points. The day is
          # explicitly Europe/Paris so a late retry never lands on UTC D-1.
          day="$(python -c "import datetime as dt; from zoneinfo import ZoneInfo; print(dt.datetime.now(ZoneInfo('Europe/Paris')).date().isoformat())")"
          python playlist_follower_daily_status.py \
            --playlists Spotify_Playlists_canonical_data.js \
            --day "$day" \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve canonical playlist baseline
        id: playlist_baseline
        if: steps.coverage_before.outputs.complete != 'true' || inputs.force == true
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/Spotify_Playlists_canonical_previous.js"
          cp -- Spotify_Playlists_canonical_data.js "$baseline"
          echo "path=$baseline" >> "$GITHUB_OUTPUT"

      - name: Create isolated read-only Soundcharts candidate
        id: candidate
        if: steps.coverage_before.outputs.complete != 'true' || inputs.force == true
        shell: bash
        run: |
          # The lightweight public page no longer points at a multi-megabyte
          # Soundcharts export. Resolve the reviewed source recorded by the
          # compact browse catalogue instead of scraping the public HTML.
          active="$(python prepare_soundcharts_snapshot.py browse-source --catalogue Spotify_Browse_Catalogue_data.js)"
          candidate="$RUNNER_TEMP/Spotify_Soundcharts_playlist_candidate.js"
          cp -- "$active" "$candidate"
          echo "path=$candidate" >> "$GITHUB_OUTPUT"

      - name: Size the request budget from the published cohort
        id: budget
        if: steps.coverage_before.outputs.complete != 'true' || inputs.force == true
        shell: bash
        run: |
          expected="${{ steps.coverage_before.outputs.expected }}"
          budget="$(( expected + (expected / 2 > 100 ? expected / 2 : 100) ))"
          echo "requests=$budget" >> "$GITHUB_OUTPUT"

      - name: Refresh every playlist published in the dashboard
        if: steps.coverage_before.outputs.complete != 'true' || inputs.force == true
        env:
          PYTHONUNBUFFERED: '1'
          SOUNDCHARTS_CLIENT_ID: ${{ secrets.SOUNDCHARTS_CLIENT_ID }}
          SOUNDCHARTS_CLIENT_SECRET: ${{ secrets.SOUNDCHARTS_CLIENT_SECRET }}
          SOUNDCHARTS_TEAM_ID: dsomoguy-api
        run: >-
          python refresh_soundcharts_daily.py
          --mode playlists
          --playlist-scope dashboard
          --workers 10
          --max-requests "${{ steps.budget.outputs.requests }}"
          --history-days 90
          --playlists Spotify_Playlists_canonical_data.js
          --soundcharts "${{ steps.candidate.outputs.path }}"

      - name: Measure coverage after collection
        id: coverage_after
        if: steps.coverage_before.outputs.complete != 'true' || inputs.force == true
        shell: bash
        run: |
          day="$(python -c "import datetime as dt; from zoneinfo import ZoneInfo; print(dt.datetime.now(ZoneInfo('Europe/Paris')).date().isoformat())")"
          python playlist_follower_daily_status.py \
            --playlists Spotify_Playlists_canonical_data.js \
            --day "$day" \
            --github-output "$GITHUB_OUTPUT"

      - name: Reject an older or poorer playlist snapshot
        if: steps.coverage_before.outputs.complete != 'true' || inputs.force == true
        run: >-
          python validate_playlist_snapshot_transition.py
          --previous "${{ steps.playlist_baseline.outputs.path }}"
          --candidate Spotify_Playlists_canonical_data.js

      - name: Build the lazy playlist analytics payload
        id: playlist_analytics
        if: steps.coverage_before.outputs.complete != 'true' || inputs.force == true
        continue-on-error: true
        run: >-
          python build_spotify_playlist_analytics.py
          --playlists Spotify_Playlists_canonical_data.js
          --output Spotify_Playlist_Analytics_data.js

      - name: Publish follower history independently
        if: steps.coverage_before.outputs.complete != 'true' || inputs.force == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Spotify_Playlists_canonical_data.js Spotify_Playlist_Analytics_data.js Spotify_Performance_data.js Spotify_Performance_tracks soundcharts-history
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh daily playlist followers"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              published_sha="$(git rev-parse HEAD)"
              python trigger_pages_deployment.py \
                --repository "$GITHUB_REPOSITORY" \
                --sha "$published_sha"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Require 100 percent daily follower coverage
        if: steps.coverage_before.outputs.complete != 'true' || inputs.force == true
        shell: bash
        run: |
          day="$(python -c "import datetime as dt; from zoneinfo import ZoneInfo; print(dt.datetime.now(ZoneInfo('Europe/Paris')).date().isoformat())")"
          python playlist_follower_daily_status.py \
            --playlists Spotify_Playlists_canonical_data.js \
            --day "$day" \
            --require-complete

      - name: Require a fresh playlist analytics projection
        if: (steps.coverage_before.outputs.complete != 'true' || inputs.force == true) && steps.playlist_analytics.outcome != 'success'
        run: |
          echo "Daily follower points were published, but the lazy analytics projection failed to build."
          exit 1

      - name: Report a healthy no-op
        if: steps.coverage_before.outputs.complete == 'true' && inputs.force != true
        run: >-
          echo "Playlist followers already complete for
          ${{ steps.coverage_before.outputs.day }}:
          ${{ steps.coverage_before.outputs.updated }}/${{ steps.coverage_before.outputs.expected }}"
